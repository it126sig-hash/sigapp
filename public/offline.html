<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2057a3">
  <title>SIGAPP Offline</title>
  <style>
    :root {
      color-scheme: light;
      --sigapp-primary: #2057a3;
      --sigapp-text: #24324b;
      --sigapp-muted: #6b7280;
      --sigapp-border: #dbe3ef;
      --sigapp-bg: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--sigapp-bg);
      color: var(--sigapp-text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid var(--sigapp-border);
      border-radius: 8px;
      background: #fff;
    }

    img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.25rem;
      line-height: 1.35;
    }

    p {
      margin: 0 0 22px;
      color: var(--sigapp-muted);
      line-height: 1.55;
    }

    button {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--sigapp-primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/images/pwa/icon-192.png" alt="SIGAPP">
    <h1>Koneksi terputus</h1>
    <p>SIGAPP membutuhkan koneksi internet untuk memuat data terbaru. Periksa jaringan Anda lalu coba muat ulang halaman.</p>
    <button type="button" onclick="window.location.reload()">Muat ulang</button>
  </main>
</body>
</html>
